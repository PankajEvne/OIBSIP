services:
  # ==========================================
  # 1. Backend Web Service (Node.js API)
  # ==========================================
  - type: web
    name: pizzahub-backend
    runtime: node
    plan: free
    rootDir: WebDev-L3-PizzaDelivery/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ==========================================
  # 2. Frontend Static Site (React Vite)
  # ==========================================
  - type: static
    name: pizzahub-frontend
    rootDir: WebDev-L3-PizzaDelivery/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
